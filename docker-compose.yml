# Unit network deployment. Sign-in is by name only (no passwords); sign in as "admin" for the admin tools.
# HTTPS: run `bash deploy/make-cert.sh parashurama.local <server-ip>` first; certificates are mounted read-only.
# Encryption at rest: create the data key once:  mkdir -p deploy/secrets && openssl rand -base64 32 > deploy/secrets/data.key
services:
  server:
    build: .
    image: parashurama:0.6.0
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      PORT: 8443
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      UNIT_NAME: "AD Troop 2"
      PARASHURAMA_DATA_KEY_FILE: /run/secrets/data_key
    secrets: [data_key]
    volumes:
      - data:/data
      - ./deploy/certs:/certs:ro
  backup:
    image: parashurama:0.6.0
    depends_on: [server]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    # Consistent SQLite backup once a day; the newest 14 are kept in /data/backups.
    entrypoint: ["/bin/sh", "-c", "while true; do node --disable-warning=ExperimentalWarning server/cli.mjs backup; sleep 86400; done"]
volumes:
  data:
secrets:
  data_key:
    file: ./deploy/secrets/data.key
