name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm run audit:prod
      - name: Software bill of materials (CycloneDX)
        run: npm run sbom && npm run notices
      - name: Type-check engine and web app
        run: npm run typecheck
      - name: Check pre-compiled config validators are current
        run: npm run check:generated
      - name: Validate doctrine and config files
        run: npm run validate:config
      - name: Engine and server tests (determinism, doctrine rules, fuzz, learning, enemy AI, config, integrity, API, auth, verification)
        run: npm test
      - name: Build web app, server bundle and single offline file
        run: npm run build && npm run build:single
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: true
      - name: Upload offline build and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: parashurama-offline
          path: |
            apps/web/dist-single/index.html
            docs/sbom.cdx.json
            THIRD_PARTY_NOTICES.md
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
